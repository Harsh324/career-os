# Career OS — Docker Compose
#
# Services:
#   dev  — Primary development container (website + packages)
#
# Usage:
#   make dev    → Start dev server
#   make shell  → Open interactive shell
#   make build  → Build all packages

name: career-os

services:
  dev:
    build:
      context: ..
      dockerfile: infra/Dockerfile.dev
    image: career-os-dev:local
    volumes:
      # Mount the entire workspace for live code changes
      - ..:/workspace
      # Named volume for pnpm content-addressable store
      # Prevents re-downloading packages on container restart (P7 — reproducibility)
      - pnpm_store:/root/.local/share/pnpm/store
      # Named volume for Turborepo cache
      - turbo_cache:/workspace/.turbo
    ports:
      - "3000:3000"   # Next.js website
      - "3001:3001"   # Future: API server
    working_dir: /workspace
    # Keep container alive for exec commands
    stdin_open: true
    tty: true
    environment:
      # Turborepo telemetry disabled (privacy)
      - TURBO_TELEMETRY_DISABLED=1
      # pnpm store path (matches named volume mount)
      - PNPM_HOME=/root/.local/share/pnpm
    command: pnpm dev

volumes:
  pnpm_store:
    name: career-os-pnpm-store
  turbo_cache:
    name: career-os-turbo-cache
